name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

# redmine_kit_ui, checked out inside the plugin's folder by the jobs below
env:
  REDMINE_KIT_UI: redmine_kit_ui

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The Rubies of Redmine 7.0 (3.2 to 4.0), pinned in
        # test/ruby-<version>.Dockerfile.
        ruby: ["3.2", "4.0"]
    env:
      TEST_RUBY: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/lint

  test:
    needs: lint
    name: test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    # id-token: Codecov's upload with OIDC, without a token secret.
    permissions:
      contents: read
      id-token: write
    env:
      TEST_RUBY: ${{ matrix.ruby }}
      # The plugin's coverage (bin/test), on the Ruby whose report is uploaded.
      COVERAGE: ${{ matrix.ruby == '4.0' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # redmine_kit_aws, which the plugin requires, until the tests install its
      # gem. The plugin's .dockerignore keeps it out of the plugin's image.
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_aws
          path: redmine_kit_aws
          persist-credentials: false
      # redmine_kit_ui, which bin/test_image installs for the new UI's tests
      # (REDMINE_KIT_UI). A private repository: read with a token of the
      # organization that can read its contents (REDMINE_KIT_UI_TOKEN).
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_kit_ui
          path: redmine_kit_ui
          token: ${{ secrets.REDMINE_KIT_UI_TOKEN }}
          persist-credentials: false
      # The plugin's tests, then every Redmine test with the plugin installed,
      # with S3 on AWS Emulator; SES sending on LocalStack when the
      # organization's secret is available (not on pull requests from forks),
      # moto otherwise (docs/setup.md#tests). The log names the backends.
      - run: bin/test --redmine
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          REDMINE_KIT_AWS_DIR: redmine_kit_aws
      # The plugin's coverage (coverage/coverage.xml, written by bin/test).
      # Not failing the run while the Codecov app is not installed.
      - if: matrix.ruby == '4.0'
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: coverage/coverage.xml
          flags: plugin
          fail_ci_if_error: false
      - if: always()
        run: bin/services --down
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

  # The plugin as a gem (bin/test-gem): built with redmine_kit_aws's gem,
  # installed, linked into plugins/ and booted with every file loaded.
  gem:
    needs: lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_aws
          path: redmine_kit_aws
          persist-credentials: false
      # redmine_kit_ui, which bin/test_image installs for the new UI's tests
      # (REDMINE_KIT_UI). A private repository: read with a token of the
      # organization that can read its contents (REDMINE_KIT_UI_TOKEN).
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_kit_ui
          path: redmine_kit_ui
          token: ${{ secrets.REDMINE_KIT_UI_TOKEN }}
          persist-credentials: false
      - run: bin/test-gem
        env:
          REDMINE_KIT_AWS_DIR: redmine_kit_aws
      - if: always()
        run: bin/services --down

  # The tests against the latest release of redmine_kit_aws (its newest v0.*
  # tag, the source of the published gem; the gemspec takes ~> 0.1), as
  # well as against its main above: adapters install the release. Skipped
  # until there is one.
  release:
    needs: lint
    name: test (redmine_kit_aws release)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: release
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/redmine-kit/redmine_aws.git 'v0.*' |
            sed 's|.*refs/tags/||' | sort -V | tail -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [[ -n "$tag" ]] || echo "::notice::redmine_kit_aws has no v0.* release yet; not tested against one"
      - if: steps.release.outputs.tag != ''
        uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_aws
          ref: ${{ steps.release.outputs.tag }}
          path: redmine_kit_aws
          persist-credentials: false
      # redmine_kit_ui, which bin/test_image installs for the new UI's tests
      # (REDMINE_KIT_UI). A private repository: read with a token of the
      # organization that can read its contents (REDMINE_KIT_UI_TOKEN).
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_kit_ui
          path: redmine_kit_ui
          token: ${{ secrets.REDMINE_KIT_UI_TOKEN }}
          persist-credentials: false
      - if: steps.release.outputs.tag != ''
        run: bin/test
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          REDMINE_KIT_AWS_DIR: redmine_kit_aws
      - if: always() && steps.release.outputs.tag != ''
        run: bin/services --down
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
